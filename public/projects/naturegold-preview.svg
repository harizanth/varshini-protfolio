<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A150E" />
      <stop offset="50%" stop-color="#2D2115" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#honeyBg)" />

  <!-- Organic honey pattern subtle background -->
  <g opacity="0.08" stroke="#F59E0B" stroke-width="1.5" fill="none">
    <polygon points="50,20 80,37 80,72 50,89 20,72 20,37" />
    <polygon points="110,20 140,37 140,72 110,89 80,72 80,37" />
    <polygon points="80,72 110,89 110,124 80,141 50,124 50,89" />
    <polygon points="530,220 560,237 560,272 530,289 500,272 500,237" />
    <polygon points="500,272 530,289 530,324 500,341 470,324 470,289" />
  </g>

  <!-- Left: Honey Jar Product Mockup -->
  <g transform="translate(60, 45)">
    <!-- Jar Lid (wood / cork finish) -->
    <rect x="50" y="20" width="100" height="28" rx="6" fill="#854D0E" stroke="#A16207" stroke-width="1.5" />
    <line x1="60" y1="28" x2="140" y2="28" stroke="#CA8A04" stroke-width="1" />
    <line x1="60" y1="36" x2="140" y2="36" stroke="#713F12" stroke-width="1" />
    
    <!-- Jar Glass Body -->
    <path d="M 45 48 C 30 55, 20 85, 20 120 L 20 230 C 20 250, 35 260, 60 260 L 140 260 C 165 260, 180 250, 180 230 L 180 120 C 180 85, 170 55, 155 48 Z" fill="#3A2814" stroke="#D97706" stroke-width="2" />
    
    <!-- Golden Liquid Level -->
    <path d="M 24 100 C 60 92, 140 92, 176 100 L 176 230 C 176 248, 162 256, 140 256 L 60 256 C 38 256, 24 248, 24 230 Z" fill="url(#goldAmber)" fill-opacity="0.85" />
    
    <!-- Product Label -->
    <rect x="36" y="118" width="128" height="110" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1" />
    
    <!-- Label Details -->
    <circle cx="100" cy="142" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
    <text x="100" y="146" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#D97706">100%</text>
    
    <text x="100" y="172" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#78350F" letter-spacing="1">
      NatureGold
    </text>
    <text x="100" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8" fill="#92400E" letter-spacing="1">
      ORGANIC RAW HONEY
    </text>
    <line x1="56" y1="194" x2="144" y2="194" stroke="#FCD34D" stroke-width="0.8" />
    <text x="100" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#78350F">
      Net Wt. 500g • Pure Wildflower
    </text>
    <text x="100" y="218" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" fill="#15803D" font-weight="600">
      ECO-FRIENDLY PACKAGING
    </text>
  </g>

  <!-- Right: Design Specification Cards -->
  <g transform="translate(290, 45)">
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF">
      NatureGold Organic Honey
    </text>
    <text x="0" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#FCD34D">
      PACKAGING LAYOUT &amp; VISUAL IDENTITY DESIGN
    </text>

    <!-- Spec box 1 -->
    <g transform="translate(0, 68)">
      <rect width="270" height="52" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FCD34D">Color Palette &amp; Purity</text>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Golden Amber (#F59E0B), Natural Honey &amp; Forest Green accents.</text>
    </g>

    <!-- Spec box 2 -->
    <g transform="translate(0, 130)">
      <rect width="270" height="52" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FCD34D">Typography Hierarchy</text>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Warm serif display title balanced with clean modern sans-serif body.</text>
    </g>

    <!-- Spec box 3 -->
    <g transform="translate(0, 192)">
      <rect width="270" height="52" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FCD34D">Packaging Structure</text>
      <text x="14" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Jar label wrap with clear regulatory, nutrition, and sustainability info.</text>
    </g>

    <text x="0" y="272" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#C4B5FD">
      Deliverables: Jar Mockups • Label Die-cut • Visual Presentation Board
    </text>
  </g>
</svg>
