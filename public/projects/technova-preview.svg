<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#techBg)" />

  <!-- Geometric Grid & Poster Lines -->
  <g opacity="0.15">
    <line x1="60" y1="0" x2="60" y2="380" stroke="#FFFFFF" stroke-width="1" />
    <line x1="180" y1="0" x2="180" y2="380" stroke="#FFFFFF" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="380" stroke="#FFFFFF" stroke-width="1" />
    <line x1="420" y1="0" x2="420" y2="380" stroke="#FFFFFF" stroke-width="1" />
    <line x1="540" y1="0" x2="540" y2="380" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="80" x2="600" y2="80" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="190" x2="600" y2="190" stroke="#FFFFFF" stroke-width="1" />
    <line x1="0" y1="300" x2="600" y2="300" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Symposium Branding Emblem -->
  <g transform="translate(80, 50)">
    <polygon points="50,10 90,80 10,80" fill="none" stroke="url(#cyanAccent)" stroke-width="3" />
    <circle cx="50" cy="56" r="16" fill="none" stroke="url(#neonGlow)" stroke-width="2.5" />
    <rect x="35" y="42" width="30" height="30" fill="none" stroke="#C4B5FD" stroke-width="1.5" transform="rotate(45 50 57)" />
  </g>

  <!-- Typography Showcase -->
  <text x="210" y="75" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="4">
    TECHNOVA
  </text>
  <text x="430" y="75" font-family="'Outfit', sans-serif" font-weight="800" font-size="34" fill="url(#cyanAccent)" letter-spacing="2">
    2027
  </text>
  <text x="212" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#C4B5FD" letter-spacing="3">
    ANNUAL NATIONAL TECHNICAL SYMPOSIUM
  </text>

  <!-- Deliverables Mockup Cards -->
  <g transform="translate(40, 140)">
    <!-- Poster Mockup Card -->
    <rect width="155" height="190" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="12" width="131" height="90" rx="4" fill="#0B192C" />
    <circle cx="77" cy="57" r="24" fill="none" stroke="url(#neonGlow)" stroke-width="2" />
    <text x="77" y="62" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TECHNOVA</text>
    <text x="14" y="125" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Poster &amp; Flyers</text>
    <text x="14" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Visual Hierarchy</text>
    <text x="14" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">High Impact Contrast</text>
    <rect x="14" y="168" width="60" height="12" rx="3" fill="#8B5CF6" fill-opacity="0.3" />
    <text x="44" y="177" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#C4B5FD">PRINT &amp; WEB</text>
  </g>

  <g transform="translate(222, 140)">
    <!-- Event ID Badge Mockup -->
    <rect width="155" height="190" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="52" y="8" width="51" height="6" rx="3" fill="#64748B" />
    <rect x="12" y="24" width="131" height="78" rx="4" fill="#0B192C" />
    <text x="77" y="55" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">DELEGATE</text>
    <text x="77" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94A3B8">TECHNOVA 2027</text>
    <text x="14" y="125" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Event Badges</text>
    <text x="14" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Consistent Identity</text>
    <text x="14" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Color-coded Tracks</text>
    <rect x="14" y="168" width="52" height="12" rx="3" fill="#38BDF8" fill-opacity="0.2" />
    <text x="40" y="177" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8">BRAND KIT</text>
  </g>

  <g transform="translate(404, 140)">
    <!-- Social & Promo Mockup -->
    <rect width="155" height="190" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <rect x="12" y="12" width="131" height="90" rx="4" fill="url(#techBg)" />
    <text x="77" y="52" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">OCTOBER</text>
    <text x="77" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#C4B5FD">REGISTER NOW</text>
    <text x="14" y="125" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Social Campaigns</text>
    <text x="14" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Instagram &amp; LinkedIn</text>
    <text x="14" y="156" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Invitation Kits</text>
    <rect x="14" y="168" width="60" height="12" rx="3" fill="#EC4899" fill-opacity="0.2" />
    <text x="44" y="177" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F472B6">MARKETING</text>
  </g>
</svg>
