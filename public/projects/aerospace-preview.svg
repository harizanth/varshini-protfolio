<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#0F2847" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#aeroBg)" />

  <!-- Top Aerospace Nav Header -->
  <rect x="0" y="0" width="600" height="42" fill="#061221" rx="16 16 0 0" />
  <circle cx="28" cy="21" r="5" fill="#38BDF8" />
  <text x="44" y="25" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#FFFFFF">
    AEROSPACE SHARE
  </text>
  <text x="300" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">
    Autonomous Navigation &amp; Airspace Telemetry Hub
  </text>
  <rect x="500" y="10" width="75" height="22" rx="4" fill="#0284C7" />
  <text x="537" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">
    ACTIVE
  </text>

  <!-- Left: Radar Screen / Flight Corridors -->
  <g transform="translate(30, 60)">
    <rect width="320" height="280" rx="10" fill="#081426" stroke="#1E3A8A" stroke-width="1.5" />
    
    <!-- Concentric radar circles -->
    <circle cx="160" cy="140" r="115" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="160" cy="140" r="85" fill="none" stroke="#1E3A8A" stroke-width="1" />
    <circle cx="160" cy="140" r="50" fill="none" stroke="#1E3A8A" stroke-width="1" />
    <circle cx="160" cy="140" r="18" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="160" y1="25" x2="160" y2="255" stroke="#1E3A8A" stroke-width="1" />
    <line x1="45" y1="140" x2="275" y2="140" stroke="#1E3A8A" stroke-width="1" />

    <!-- Flight Routes -->
    <path d="M 60 210 Q 120 110, 160 140 T 260 80" fill="none" stroke="url(#blueGlow)" stroke-width="2.5" stroke-dasharray="6 3" />
    
    <!-- Autonomous Aircraft Blips -->
    <circle cx="120" cy="120" r="5" fill="#38BDF8" />
    <text x="130" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#38BDF8">AV-104 (FL320)</text>

    <circle cx="210" cy="110" r="5" fill="#10B981" />
    <text x="220" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#10B981">DRONE-CORR B</text>

    <circle cx="160" cy="140" r="3" fill="#F59E0B" />
    <text x="160" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#F59E0B">CONTROL NODE</text>
  </g>

  <!-- Right: Telemetry & Airspace Status Panels -->
  <g transform="translate(370, 60)">
    <!-- Panel 1 -->
    <rect width="200" height="85" rx="8" fill="#0C1D38" stroke="#1E3A8A" />
    <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Airspace Congestion</text>
    <text x="14" y="52" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#38BDF8">OPTIMAL</text>
    <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#60A5FA">0 Conflict Alerts</text>

    <!-- Panel 2 -->
    <g transform="translate(0, 98)">
      <rect width="200" height="85" rx="8" fill="#0C1D38" stroke="#1E3A8A" />
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Autonomous Navigation</text>
      <text x="14" y="52" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#10B981">SYNCED</text>
      <text x="14" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#6EE7B7">Waypoints Latched</text>
    </g>

    <!-- Panel 3 -->
    <g transform="translate(0, 196)">
      <rect width="200" height="84" rx="8" fill="#0C1D38" stroke="#1E3A8A" />
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94A3B8">Concept Focus</text>
      <text x="14" y="44" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Shared Corridors</text>
      <text x="14" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">Drone &amp; Commercial Air</text>
      <text x="14" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#C4B5FD">Next-Gen Interface</text>
    </g>
  </g>
</svg>
