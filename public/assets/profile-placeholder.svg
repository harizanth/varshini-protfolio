<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)" />

  <!-- Decorative ambient grid/circles -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="200" cy="180" r="110" fill="url(#accentGrad)" fill-opacity="0.08" filter="url(#softGlow)" />
  <circle cx="200" cy="180" r="95" fill="#0F172A" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Avatar Silhouette Icon -->
  <g transform="translate(145, 120)">
    <!-- Head -->
    <circle cx="55" cy="40" r="32" fill="#E2E8F0" />
    <!-- Hair accent -->
    <path d="M 23 40 C 23 18, 40 8, 55 8 C 70 8, 87 18, 87 40 C 87 48, 80 50, 75 42 C 70 34, 40 34, 35 42 C 30 50, 23 48, 23 40 Z" fill="#475569" />
    <!-- Shoulders -->
    <path d="M 12 110 C 12 80, 32 72, 55 72 C 78 72, 98 80, 98 110 Z" fill="#E2E8F0" />
    <!-- Blazer / Lapel -->
    <path d="M 32 82 L 55 110 L 78 82 L 68 76 L 55 96 L 42 76 Z" fill="#8B5CF6" />
  </g>

  <!-- Initials Badge -->
  <g transform="translate(200, 310)">
    <rect x="-90" y="-18" width="180" height="36" rx="18" fill="url(#accentGrad)" />
    <text x="0" y="5" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#0B192C" letter-spacing="1.5">
      S. VARSHINI
    </text>
  </g>

  <!-- Information Tag -->
  <text x="200" y="365" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="15" fill="#FFFFFF">
    Computer Science &amp; Design
  </text>
  <text x="200" y="388" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">
    SNS College of Technology
  </text>

  <!-- Photo replace guide hint -->
  <g transform="translate(40, 420)">
    <rect width="320" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="160" y="21" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#C4B5FD">
      Drop your photo at: public/assets/profile.jpg
    </text>
  </g>
</svg>
